[project]
name = "skillet-eval"
version = "0.1.0"
description = "Python reference implementation for skillet eval"
readme = { file = "../../README.md", content-type = "text/markdown" }
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Render" }]
keywords = ["skill", "eval", "benchmark", "llm", "anthropic", "openai", "google", "gemini", "claude", "gpt"]

dependencies = [
    "typer>=0.24.1",
    "pydantic>=2.12.0",
    "PyYAML>=6.0.3",
    "rich>=14.3.3",
    "anthropic>=0.84.0",
    "openai>=2.26.0",
    "google-genai>=1.66.0",
    "python-dotenv>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
]

[project.scripts]
skillet-eval = "skill_eval.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001", "B008"]
